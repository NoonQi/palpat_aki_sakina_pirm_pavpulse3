<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIRM Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #e9e7e0; padding: 20px; }
  #pirm-admin-root {
    --asphalt: #24262b;
    --asphalt-soft: #3a3d44;
    --paper: #f6f4ee;
    --paper-line: #e4e0d6;
    --safety-orange: #e8590c;
    --route-blue: #1971c2;
    --fixed-green: #2f9e44;
    --caution-yellow: #f5b700;
    --priority-high: #e03131;
    --priority-med: #f08c00;
    --priority-low: #868e96;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--asphalt);
    padding: 28px 22px 60px;
    border-radius: 10px;
    max-width: 900px;
    margin: 0 auto;
    box-sizing: border-box;
  }
  #pirm-admin-root * { box-sizing: border-box; }

  .pirm-display {
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  /* Header */
  .pirm-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 4px solid var(--asphalt);
    padding-bottom: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .pirm-header-left { display: flex; align-items: center; gap: 12px; }
  .pirm-badge-icon {
    width: 42px; height: 42px; border-radius: 6px;
    background: var(--safety-orange);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    box-shadow: 3px 3px 0 var(--asphalt);
  }
  .pirm-title { font-size: 24px; font-weight: 600; margin: 0; line-height: 1; }
  .pirm-subtitle {
    font-size: 12.5px; color: var(--asphalt-soft); margin-top: 4px;
    font-family: 'Inter', sans-serif; text-transform: none; letter-spacing: 0;
  }
  .pirm-live-tag {
    font-size: 11px; font-weight: 700; color: #fff; background: var(--fixed-green);
    padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px;
  }
  .pirm-live-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pirm-pulse 1.6s infinite; }
  @keyframes pirm-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* New incident form */
  .pirm-form-section {
    background: var(--asphalt);
    color: var(--paper);
    border-radius: 8px;
    padding: 18px 18px 20px;
    margin-bottom: 26px;
  }
  .pirm-form-heading {
    font-size: 14px; font-weight: 600; margin: 0 0 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .pirm-form-grid {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .pirm-form-grid input[type="text"], .pirm-form-grid select {
    width: 100%;
    font-family: inherit; font-size: 13px; padding: 9px 11px;
    border: none; border-radius: 6px; background: #fff; color: var(--asphalt);
  }
  .pirm-form-row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .pirm-upload-box {
    border: 2px dashed #565962; border-radius: 6px; padding: 10px;
    display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.04);
  }
  .pirm-upload-box input[type="file"] { font-size: 11px; color: var(--paper); flex: 1; }
  .pirm-preview-thumb {
    width: 40px; height: 40px; border-radius: 5px; object-fit: cover; flex-shrink: 0; display: none;
  }
  .pirm-geo-box {
    border: 2px dashed #565962; border-radius: 6px; padding: 10px;
    display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.04);
  }
  .pirm-geo-btn {
    font-family: inherit; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.03em; background: var(--safety-orange); color: #fff; border: none;
    padding: 8px 12px; border-radius: 5px; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }
  .pirm-geo-btn:hover { filter: brightness(1.08); }
  .pirm-geo-status { font-size: 11.5px; color: #c9cbd1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pirm-submit-btn {
    font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.03em; background: var(--fixed-green); color: #fff; border: none;
    padding: 10px 20px; border-radius: 6px; cursor: pointer;
  }
  .pirm-submit-btn:hover { filter: brightness(1.08); }
  .pirm-submit-btn:disabled { background: #565962; cursor: not-allowed; }
  .pirm-form-note { font-size: 11px; color: #9a9ca3; margin-top: 8px; }

  /* Stat strip - route markers */
  .pirm-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 26px;
  }
  .pirm-stat {
    background: var(--asphalt);
    color: var(--paper);
    border-radius: 8px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }
  .pirm-stat::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
    background: var(--stat-color, var(--safety-orange));
  }
  .pirm-stat-num { font-family: 'Oswald', sans-serif; font-size: 30px; font-weight: 600; line-height: 1; }
  .pirm-stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: #b8bac0; margin-top: 4px; }

  /* Controls */
  .pirm-controls {
    display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center;
  }
  .pirm-controls input, .pirm-controls select {
    font-family: inherit; font-size: 13px; padding: 8px 12px;
    border: 2px solid var(--asphalt); border-radius: 6px; background: #fff; color: var(--asphalt);
  }
  .pirm-controls input { flex: 1; min-width: 160px; }
  .pirm-controls select { cursor: pointer; }
  .pirm-result-count { font-size: 12px; color: var(--asphalt-soft); margin-left: auto; }

  /* Report cards - ticket stub styling */
  .pirm-list { display: flex; flex-direction: column; gap: 14px; }
  .pirm-card {
    background: #fff;
    border: 2px solid var(--asphalt);
    border-radius: 8px;
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 16px;
    padding: 14px;
    position: relative;
    align-items: center;
  }
  .pirm-card::before {
    content: '';
    position: absolute; left: 106px; top: 0; bottom: 0; width: 0;
    border-left: 2px dashed var(--paper-line);
  }
  .pirm-photo {
    width: 90px; height: 74px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #fff; flex-shrink: 0;
    background-size: cover; background-position: center;
  }
  .pirm-card-main { min-width: 0; }
  .pirm-card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .pirm-card-title { font-weight: 600; font-size: 15px; }
  .pirm-tag {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 8px; border-radius: 20px; color: #fff; white-space: nowrap;
  }
  .pirm-meta { font-size: 12px; color: var(--asphalt-soft); display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
  .pirm-meta span { display: flex; align-items: center; gap: 4px; }

  /* Road progress tracker (signature element) */
  .pirm-track { display: flex; align-items: center; margin-top: 10px; max-width: 260px; }
  .pirm-track-seg { flex: 1; height: 4px; background: var(--paper-line); position: relative; }
  .pirm-track-seg.filled { background: var(--asphalt); }
  .pirm-track-dot {
    width: 12px; height: 12px; border-radius: 50%; background: var(--paper-line);
    border: 2px solid var(--asphalt); flex-shrink: 0; z-index: 1;
  }
  .pirm-track-dot.active { background: var(--safety-orange); }
  .pirm-track-dot.done { background: var(--fixed-green); }
  .pirm-track-labels { display: flex; justify-content: space-between; max-width: 260px; margin-top: 3px; }
  .pirm-track-labels span { font-size: 9px; color: var(--asphalt-soft); text-transform: uppercase; letter-spacing: 0.03em; width: 60px; text-align: center; }
  .pirm-track-labels span:first-child { text-align: left; width: 40px; }
  .pirm-track-labels span:last-child { text-align: right; width: 40px; }

  .pirm-card-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .pirm-upvote {
    display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700;
    color: var(--asphalt); background: var(--paper); border: 2px solid var(--asphalt);
    border-radius: 20px; padding: 4px 12px; cursor: pointer; font-family: inherit;
    transition: transform 0.1s ease;
  }
  .pirm-upvote:hover { background: var(--paper-line); }
  .pirm-upvote:active { transform: scale(0.95); }
  .pirm-upvote.voted { background: var(--safety-orange); color: #fff; border-color: var(--safety-orange); }
  .pirm-status-select {
    font-family: inherit; font-size: 12px; font-weight: 600; padding: 7px 10px;
    border-radius: 6px; border: 2px solid var(--asphalt); background: var(--paper); cursor: pointer;
  }
  .pirm-empty { text-align: center; padding: 40px 20px; color: var(--asphalt-soft); font-size: 13px; }

  @media (max-width: 560px) {
    .pirm-form-grid, .pirm-form-row2 { grid-template-columns: 1fr; }
    .pirm-card { grid-template-columns: 60px 1fr; }
    .pirm-card::before { left: 76px; }
    .pirm-photo { width: 60px; height: 54px; font-size: 18px; }
    .pirm-card-actions { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; margin-top: 6px; }
  }
</style>
</head>
<body>
<div id="pirm-admin-root"></div>

<script>
(function() {
  const STATUSES = ['Reported', 'Acknowledged', 'Fixed'];
  const STATUS_COLOR = { Reported: 'var(--caution-yellow)', Acknowledged: 'var(--route-blue)', Fixed: 'var(--fixed-green)' };
  const PRIORITY_COLOR = { Highest: 'var(--priority-high)', High: 'var(--priority-high)', Medium: 'var(--priority-med)', Low: 'var(--priority-low)' };
  const CATEGORY_ICON = { Pothole: '🕳️', Streetlight: '💡', Drainage: '🌊', Garbage: '🗑️', Signage: '🚧' };
  const CATEGORY_COLOR = { Pothole: '#495057', Streetlight: '#f08c00', Drainage: '#1971c2', Garbage: '#2f9e44', Signage: '#e8590c' };

  let reports = [
    { id: 'PIRM-101', title: 'Deep pothole blocking left lane', category: 'Pothole', priority: 'Highest', status: 'Reported', location: 'MG Road, near Deccan signal', upvotes: 42, date: '2 days ago', photo: null },
    { id: 'PIRM-102', title: 'Streetlight out for 3 nights running', category: 'Streetlight', priority: 'High', status: 'Acknowledged', location: 'FC Road, lane 4', upvotes: 27, date: '4 days ago', photo: null },
    { id: 'PIRM-103', title: 'Overflowing drain after rain', category: 'Drainage', priority: 'Highest', status: 'Reported', location: 'Karve Nagar underpass', upvotes: 58, date: '1 day ago', photo: null },
    { id: 'PIRM-104', title: 'Garbage pileup near market entrance', category: 'Garbage', priority: 'Medium', status: 'Fixed', location: 'Tulshibaug market', upvotes: 15, date: '9 days ago', photo: null },
    { id: 'PIRM-105', title: 'Faded pedestrian crossing markings', category: 'Signage', priority: 'Low', status: 'Reported', location: 'JM Road junction', upvotes: 8, date: '6 days ago', photo: null },
    { id: 'PIRM-106', title: 'Cracked road surface, cyclists at risk', category: 'Pothole', priority: 'High', status: 'Acknowledged', location: 'Baner Road service lane', upvotes: 33, date: '5 days ago', photo: null },
    { id: 'PIRM-107', title: 'Broken streetlight pole, exposed wiring', category: 'Streetlight', priority: 'Highest', status: 'Reported', location: 'Kothrud Depot road', upvotes: 61, date: '12 hrs ago', photo: null },
    { id: 'PIRM-108', title: 'Manhole cover missing', category: 'Drainage', priority: 'Highest', status: 'Fixed', location: 'Shivajinagar bus stand', upvotes: 71, date: '11 days ago', photo: null },
    { id: 'PIRM-109', title: 'Illegal dumping near school zone', category: 'Garbage', priority: 'Medium', status: 'Acknowledged', location: 'Aundh school lane', upvotes: 19, date: '3 days ago', photo: null },
    { id: 'PIRM-110', title: 'Pothole cluster, 4 reports in same block', category: 'Pothole', priority: 'Highest', status: 'Reported', location: 'Hadapsar bypass', upvotes: 49, date: '2 days ago', photo: null },
  ];

  let filters = { status: 'All', category: 'All', search: '' };
  let votedIds = new Set();
  let nextIdNum = 111;
  let pendingPhoto = null;   // data URL of uploaded photo
  let pendingCoords = null;  // { lat, lng }

  const root = document.getElementById('pirm-admin-root');

  function trackHTML(status) {
    const idx = STATUSES.indexOf(status);
    return `
      <div class="pirm-track">
        ${STATUSES.map((s, i) => `
          ${i > 0 ? `<div class="pirm-track-seg ${i <= idx ? 'filled' : ''}"></div>` : ''}
          <div class="pirm-track-dot ${i < idx ? 'done' : ''} ${i === idx ? 'active' : ''}"></div>
        `).join('')}
      </div>
      <div class="pirm-track-labels"><span>Reported</span><span>Ack'd</span><span>Fixed</span></div>
    `;
  }

  function statCounts() {
    const counts = { Reported: 0, Acknowledged: 0, Fixed: 0 };
    reports.forEach(r => counts[r.status]++);
    return counts;
  }

  function render() {
    const counts = statCounts();
    const totalUpvotes = reports.reduce((sum, r) => sum + r.upvotes, 0);

    const filtered = reports.filter(r => {
      if (filters.status !== 'All' && r.status !== filters.status) return false;
      if (filters.category !== 'All' && r.category !== filters.category) return false;
      if (filters.search && !(r.title + r.location).toLowerCase().includes(filters.search.toLowerCase())) return false;
      return true;
    });

    root.innerHTML = `
      <div class="pirm-header">
        <div class="pirm-header-left">
          <div class="pirm-badge-icon">🛠️</div>
          <div>
            <p class="pirm-title pirm-display">PIRM Admin Console</p>
            <p class="pirm-subtitle">Pothole &amp; Infrastructure Reporting Map — municipal review panel</p>
          </div>
        </div>
        <div class="pirm-live-tag"><span class="pirm-live-dot"></span>${reports.length} reports live</div>
      </div>

      <div class="pirm-form-section">
        <p class="pirm-form-heading pirm-display">📢 Report a New Incident</p>
        <div class="pirm-form-grid">
          <input id="pirm-new-title" type="text" placeholder="What's the issue? e.g. Pothole near bus stop">
          <select id="pirm-new-category">
            ${Object.keys(CATEGORY_ICON).map(c => `<option>${c}</option>`).join('')}
          </select>
        </div>
        <div class="pirm-form-row2">
          <div class="pirm-upload-box">
            <input id="pirm-new-photo" type="file" accept="image/*" capture="environment">
            <img id="pirm-preview-thumb" class="pirm-preview-thumb" alt="preview">
          </div>
          <div class="pirm-geo-box">
            <button id="pirm-geo-btn" class="pirm-geo-btn" type="button">📍 Use My Location</button>
            <span id="pirm-geo-status" class="pirm-geo-status">No location attached yet</span>
          </div>
        </div>
        <button id="pirm-submit-btn" class="pirm-submit-btn">Submit Report</button>
        <p class="pirm-form-note">Photo and location are optional in this demo, but recommended — real reports need both to be actionable.</p>
      </div>

      <div class="pirm-stats">
        <div class="pirm-stat" style="--stat-color: var(--caution-yellow)">
          <div class="pirm-stat-num">${counts.Reported}</div><div class="pirm-stat-label">Reported</div>
        </div>
        <div class="pirm-stat" style="--stat-color: var(--route-blue)">
          <div class="pirm-stat-num">${counts.Acknowledged}</div><div class="pirm-stat-label">Acknowledged</div>
        </div>
        <div class="pirm-stat" style="--stat-color: var(--fixed-green)">
          <div class="pirm-stat-num">${counts.Fixed}</div><div class="pirm-stat-label">Fixed</div>
        </div>
        <div class="pirm-stat" style="--stat-color: var(--safety-orange)">
          <div class="pirm-stat-num">${totalUpvotes}</div><div class="pirm-stat-label">Total Upvotes</div>
        </div>
        <div class="pirm-stat" style="--stat-color: #868e96">
          <div class="pirm-stat-num">${Math.round((counts.Fixed / reports.length) * 100)}%</div><div class="pirm-stat-label">Resolution Rate</div>
        </div>
      </div>

      <div class="pirm-controls">
        <input id="pirm-search" type="text" placeholder="Search by title or location..." value="${filters.search}">
        <select id="pirm-filter-status">
          <option ${filters.status==='All'?'selected':''}>All</option>
          ${STATUSES.map(s => `<option ${filters.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select id="pirm-filter-category">
          <option ${filters.category==='All'?'selected':''}>All</option>
          ${Object.keys(CATEGORY_ICON).map(c => `<option ${filters.category===c?'selected':''}>${c}</option>`).join('')}
        </select>
        <span class="pirm-result-count">${filtered.length} of ${reports.length} shown</span>
      </div>

      <div class="pirm-list">
        ${filtered.length === 0 ? '<div class="pirm-empty">No reports match these filters. Try widening your search.</div>' : filtered.map(r => `
          <div class="pirm-card">
            <div class="pirm-photo" style="${r.photo ? `background-image:url('${r.photo}')` : `background:${CATEGORY_COLOR[r.category]}`}">
              ${r.photo ? '' : CATEGORY_ICON[r.category]}
            </div>
            <div class="pirm-card-main">
              <div class="pirm-card-top">
                <span class="pirm-card-title">${r.title}</span>
                <span class="pirm-tag" style="background:${PRIORITY_COLOR[r.priority]}">${r.priority}</span>
                <span class="pirm-tag" style="background:${CATEGORY_COLOR[r.category]}">${r.category}</span>
              </div>
              <div class="pirm-meta">
                <span>📍 ${r.location}</span>
                <span>🕐 ${r.date}</span>
                <span>#${r.id}</span>
              </div>
              ${trackHTML(r.status)}
            </div>
            <div class="pirm-card-actions">
              <button class="pirm-upvote ${votedIds.has(r.id) ? 'voted' : ''}" data-vote-id="${r.id}">▲ ${r.upvotes}</button>
              <select class="pirm-status-select" data-id="${r.id}" style="color:#fff;background:${STATUS_COLOR[r.status]}">
                ${STATUSES.map(s => `<option value="${s}" ${r.status===s?'selected':''}>${s}</option>`).join('')}
              </select>
            </div>
          </div>
        `).join('')}
      </div>
    `;

    // filters
    document.getElementById('pirm-search').addEventListener('input', e => { filters.search = e.target.value; render(); });
    document.getElementById('pirm-filter-status').addEventListener('change', e => { filters.status = e.target.value; render(); });
    document.getElementById('pirm-filter-category').addEventListener('change', e => { filters.category = e.target.value; render(); });

    // status change
    root.querySelectorAll('.pirm-status-select').forEach(sel => {
      sel.addEventListener('change', e => {
        const id = e.target.getAttribute('data-id');
        reports.find(r => r.id === id).status = e.target.value;
        render();
      });
    });

    // upvote (one vote per report per session)
    root.querySelectorAll('.pirm-upvote').forEach(btn => {
      btn.addEventListener('click', e => {
        const id = e.currentTarget.getAttribute('data-vote-id');
        const report = reports.find(r => r.id === id);
        if (votedIds.has(id)) {
          votedIds.delete(id);
          report.upvotes -= 1;
        } else {
          votedIds.add(id);
          report.upvotes += 1;
        }
        render();
      });
    });

    // photo upload preview
    document.getElementById('pirm-new-photo').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        pendingPhoto = ev.target.result;
        const thumb = document.getElementById('pirm-preview-thumb');
        thumb.src = pendingPhoto;
        thumb.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    // geotag capture
    document.getElementById('pirm-geo-btn').addEventListener('click', () => {
      const statusEl = document.getElementById('pirm-geo-status');
      if (!navigator.geolocation) {
        statusEl.textContent = 'Geolocation not supported on this browser';
        return;
      }
      statusEl.textContent = 'Detecting location...';
      navigator.geolocation.getCurrentPosition(
        pos => {
          pendingCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          statusEl.textContent = `📍 ${pendingCoords.lat.toFixed(4)}, ${pendingCoords.lng.toFixed(4)}`;
        },
        err => { statusEl.textContent = 'Location access denied or unavailable'; },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    });

    // submit new report
    document.getElementById('pirm-submit-btn').addEventListener('click', () => {
      const title = document.getElementById('pirm-new-title').value.trim();
      const category = document.getElementById('pirm-new-category').value;
      if (!title) {
        document.getElementById('pirm-new-title').focus();
        return;
      }
      const locationText = pendingCoords
        ? `${pendingCoords.lat.toFixed(4)}, ${pendingCoords.lng.toFixed(4)}`
        : 'Location not attached';
      reports.unshift({
        id: `PIRM-${nextIdNum++}`,
        title,
        category,
        priority: 'Medium',
        status: 'Reported',
        location: locationText,
        upvotes: 0,
        date: 'Just now',
        photo: pendingPhoto,
      });
      pendingPhoto = null;
      pendingCoords = null;
      render();
    });
  }

  render();
})();
</script>
</body>
</html>
